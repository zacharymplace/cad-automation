Object.values(groups).forEach(g=>scene.add(g));
const base={skin:[0xff7a59,0xffa07a],rail:[0x4fd1c5,0x81e6d9],lip:[0xf6e05e,0xfaf089],pad:[0x4c8dff,0x7aa8ff],module:[0xb794f4,0xd6bcfa],diffuser:[0xfff2a8,0xfff2a8]};
let k=0;
MESHES.forEach(m=>{
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(m.v,3));g.setIndex(m.i);g.computeVertexNormals();
  const split=document.getElementById('explode');
  const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:base[m.group][0],roughness:.55,metalness:.05,side:THREE.DoubleSide}));
  if(m.group==='diffuser'){mesh.material.transparent=true;mesh.material.opacity=.5;}
  mesh.userData={alt:base[m.group][1],main:base[m.group][0],k:k++};
  groups[m.group].add(mesh);
});
// mannequin: head ellipsoid, neck, shoulder slope under the yoke, torso
const mat=new THREE.MeshStandardMaterial({color:0x9aa0b4,roughness:.9,transparent:true,opacity:.55});
const h=new THREE.Mesh(new THREE.SphereGeometry(1,40,28),mat);h.scale.set(...MAN.head.r);h.position.set(...MAN.head.c);groups.man.add(h);
const n=new THREE.Mesh(new THREE.CylinderGeometry(MAN.neck_r,MAN.neck_r*1.1,140,32),mat);n.rotation.x=Math.PI/2;n.position.z=20;groups.man.add(n);
const S=MAN.shoulder, off=3.5;
const sh=new THREE.Mesh(new THREE.CylinderGeometry(.5,1,S.drop,48,1,true),mat);sh.rotation.x=Math.PI/2;sh.scale.set(S.a,1,S.b);sh.position.z=-S.drop/2-off;groups.man.add(sh);
const cap=new THREE.Mesh(new THREE.CircleGeometry(.5,48),mat);cap.scale.set(S.a,S.b,1);cap.position.z=-off;groups.man.add(cap);
const torso=new THREE.Mesh(new THREE.CylinderGeometry(1,.85,220,48),mat);torso.rotation.x=Math.PI/2;torso.scale.set(S.a-5,1,S.b);torso.position.z=-S.drop-off-110;groups.man.add(torso);

for(const id of ['man','skin','rail','lip','pad','module','diffuser'])document.getElementById(id).onchange=e=>groups[id].visible=e.target.checked;
document.getElementById('explode').onchange=e=>{
  Object.entries(groups).forEach(([gk,g])=>{if(gk!=='man')g.children.forEach(m=>m.material.color.setHex(e.target.checked&&m.userData.k%2?m.userData.alt:m.userData.main));});
};
(function loop(){requestAnimationFrame(loop);
  if(document.getElementById('spin').checked){const a=.004,x=cam.position.x-ctl.target.x,y=cam.position.y-ctl.target.y;
    cam.position.x=ctl.target.x+x*Math.cos(a)-y*Math.sin(a);cam.position.y=ctl.target.y+x*Math.sin(a)+y*Math.cos(a);}
  ctl.update();r.render(scene,cam);})();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script>
