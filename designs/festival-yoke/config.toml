# All dimensions in mm. Measure the wearer, edit, rerun build.py.
# Design rule: nothing rises above the wearer's shoulders, so nobody's view is blocked.
# Sizing: pick a preset (S/M/L/XL) or "custom". All lengths in mm, see MEASURING.md.
# Override per run with: FESTIVAL_YOKE_SIZE=L uv run --no-project --with cadquery build.py
size = "M"

# Kit: which modules are on the collar. See [kits.*] below; override per run with FESTIVAL_YOKE_KIT=glow.
kit = "full"

[sizes.S]
head_circumference = 540
neck_circumference = 320
shoulder_width = 350        # across the back, shoulder tip to shoulder tip
shoulder_depth = 230        # front to back over the top of the shoulder
shoulder_drop = 38          # neck-base to shoulder-tip height difference

[sizes.M]
head_circumference = 570
neck_circumference = 350
shoulder_width = 380
shoulder_depth = 260
shoulder_drop = 40

[sizes.L]
head_circumference = 590
neck_circumference = 380
shoulder_width = 410
shoulder_depth = 280
shoulder_drop = 42

[sizes.XL]
head_circumference = 610
neck_circumference = 410
shoulder_width = 440
shoulder_depth = 300
shoulder_drop = 45

[custom]                    # used when size = "custom": your own measurements
head_circumference = 570
neck_circumference = 350
shoulder_width = 380
shoulder_depth = 260
shoulder_drop = 40

[yoke]
thickness = 2.0               # skin thickness, print in TPU
front_gap = 70                # open front so it flexes on over the head
slot_width = 16
round = 0.6                   # edge rounding radius on the skin (it sits next to other people's faces)

[rail]                        # T-rail for clip-on modules (cup, phone, fan arm), runs round the sides and back
position = 0.65               # 0 = neck edge, 1 = outer edge
stem_width = 3
stem_height = 5
cap_width = 6
cap_height = 2

[glow]                        # outer lip that holds an LED strip between it and the rail
position = 0.95               # stands on the skin (not on its feather edge) so it is properly anchored
lip_height = 5
lip_width = 1.6

[pad]                         # raised, skin-conforming seats on the underside for stick-on foam where it rests on the trapezius
position = 0.5
length = 36                   # radial
width = 24
thickness = 3
angles = [30, 150, 210, 330]  # between the slots, clear of the seams

[diffuser]                    # translucent snap-over cover for the LED channel, printed in natural PETG
thickness = 1.2
gap = 0.3                     # clearance over the rail cap and lip
hook = 4.5                    # height of the outer hook that grips the lip

[joint]                       # dovetail tabs hold the four quarters together
positions_side = [0.3, 0.5]   # along the side seams, 0 = neck edge, 1 = outer edge (keep clear of the rail)
positions_back = [0.4]        # the back seam is short, so one tab
root_width = 6
tip_width = 10
length = 12
clearance = 0.25              # gap between tab and pocket; tune to your printer

[print]
bed = [220, 220, 250]
density_g_cc = 1.25           # PETG/TPU ballpark

[kits.core]
modules = []
blurb = "Just the collar: yoke, foam seats, rail and lip. Wearable on its own, nothing powered."

[kits.glow]
modules = ["pod"]
blurb = "Core plus the power pod, LED strip and diffuser cover."

[kits.carry]
modules = ["cup", "phone", "id", "pod"]
blurb = "Core plus the hands-free carriers: cup, phone and a medical-ID / card pouch. The pod rides along as the counterweight at the back."

[kits.comfort]
modules = ["dock", "fan", "pod"]
blurb = "Core plus sensory and cooling help: ear-defender dock and fan, with the power pod."

[kits.full]
modules = ["cup", "phone", "dock", "fan", "pod", "id", "tube"]
blurb = "Everything: carry, comfort, glow, plus a hydration-tube clip."
