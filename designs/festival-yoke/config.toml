# All dimensions in mm. Measure the wearer, edit, rerun build.py.
# Design rule: nothing rises above the wearer's shoulders, so nobody's view is blocked.
# Sizing: pick a preset (S/M/L/XL) or "custom". All lengths in mm, see MEASURING.md.
# Override per run with: FESTIVAL_YOKE_SIZE=L uv run --no-project --with cadquery build.py
size = "M"

[sizes.S]
head_circumference = 540
neck_circumference = 320
shoulder_width = 350        # across the back, shoulder tip to shoulder tip
shoulder_depth = 230        # front to back over the top of the shoulder
shoulder_drop = 38          # neck-base to shoulder-tip height difference

[sizes.M]
head_circumference = 570
neck_circumference = 350
shoulder_width = 380
shoulder_depth = 260
shoulder_drop = 40

[sizes.L]
head_circumference = 590
neck_circumference = 380
shoulder_width = 410
shoulder_depth = 280
shoulder_drop = 42

[sizes.XL]
head_circumference = 610
neck_circumference = 410
shoulder_width = 440
shoulder_depth = 300
shoulder_drop = 45

[custom]                    # used when size = "custom": your own measurements
head_circumference = 570
neck_circumference = 350
shoulder_width = 380
shoulder_depth = 260
shoulder_drop = 40

[yoke]
thickness = 2.0               # skin thickness, print in TPU
front_gap = 70                # open front so it flexes on over the head
slot_width = 16

[rail]                        # T-rail for clip-on modules (cup, phone, fan arm), runs round the sides and back
position = 0.82               # 0 = neck edge, 1 = outer edge
stem_width = 3
stem_height = 5
cap_width = 6
cap_height = 2

[glow]                        # outer lip that holds an LED strip between it and the rail
lip_height = 5
lip_width = 1.6

[joint]                       # dovetail tabs hold the four quarters together
positions_side = [0.35, 0.65] # along the side seams, 0 = neck edge, 1 = outer edge (keep clear of the rail at 0.82)
positions_back = [0.5]        # the back seam is short, so one tab
root_width = 6
tip_width = 10
length = 12
clearance = 0.25              # gap between tab and pocket; tune to your printer

[print]
bed = [220, 220, 250]
density_g_cc = 1.25           # PETG/TPU ballpark
