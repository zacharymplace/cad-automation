name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out cad-automation
        uses: actions/checkout@v4
        with:
          path: cad-automation

      - name: Check out zcad-core
        uses: actions/checkout@v4
        with:
          repository: REPLACE_WITH_OWNER/zcad-core
          ref: v0.1.0
          path: zcad-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core and product
        working-directory: cad-automation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "../zcad-core"
          python -m pip install -e ".[dev]"

      - name: Verify package boundary
        working-directory: cad-automation
        run: |
          python -c "import zcad, zcad_core; print(zcad.__file__); print(zcad_core.__file__)"

      - name: Ruff format
        working-directory: cad-automation
        run: |
          ruff format --check src tests

      - name: Ruff lint
        working-directory: cad-automation
        run: |
          ruff check src tests

      - name: Pytest
        working-directory: cad-automation
        run: |
          pytest -q
